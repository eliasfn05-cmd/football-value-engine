name: daily-scheduler

on:
  schedule:
    # 06:00 America/Lima (UTC-5): discover card + first score
    - cron: "0 11 * * *"
    # 11:00 America/Lima (UTC-5): refresh odds/lineups for shortlist + rescore
    - cron: "0 16 * * *"
    # 23:30 America/Lima (04:30 UTC on the following UTC day): settle + learn
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - morning
          - refresh
          - settlement
      target_date:
        description: "Optional date YYYY-MM-DD; blank = current date in America/Lima"
        required: false
        type: string
      generation_job_id:
        description: "Optional dashboard PremiumGenerationJob id"
        required: false
        type: string

# Interactive dashboard work must not wait behind the long scheduled full-card run.
# Repeated dashboard requests for the same date replace an older stuck interactive run.
concurrency:
  group: football-value-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.generation_job_id != '' && format('interactive-{0}', github.event.inputs.target_date) || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.generation_job_id != '' }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: scheduler-cli-only-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_BOOKMAKERS: Betano,Bet365,Betfair,Unibet,1xBet,Betway
      PREFERRED_BOOKMAKER: Betano
      APP_TIMEZONE: America/Lima
      MODEL_VERSION: "8.0"
      MIN_EDGE: "0.06"
      MIN_EV: "0.08"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Validate scheduler secrets
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing GitHub secret: RENDER_DATABASE_URL"
            exit 1
          fi
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "Missing GitHub secret: API_FOOTBALL_KEY"
            exit 1
          fi
          if [ -z "$ODDS_API_IO_KEY" ]; then
            echo "WARNING: GitHub secret ODDS_API_IO_KEY is missing; secondary odds fallback will be disabled."
          else
            echo "Secondary odds fallback: Odds-API.io enabled."
          fi

      - name: Resolve Lima date and requested mode
        id: schedule
        shell: bash
        env:
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_DATE: ${{ github.event.inputs.target_date }}
          GENERATION_JOB_ID: ${{ github.event.inputs.generation_job_id }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${MANUAL_MODE:-full}"
          elif [ "$SCHEDULE_EXPRESSION" = "0 11 * * *" ]; then
            MODE="morning"
          elif [ "$SCHEDULE_EXPRESSION" = "0 16 * * *" ]; then
            MODE="refresh"
          else
            MODE="settlement"
          fi

          if [ -n "$MANUAL_DATE" ]; then
            TARGET_DATE="$MANUAL_DATE"
          else
            TARGET_DATE="$(TZ=America/Lima date +%F)"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "generation_job_id=${GENERATION_JOB_ID:-}" >> "$GITHUB_OUTPUT"
          echo "Resolved requested mode=$MODE target_date=$TARGET_DATE generation_job_id=${GENERATION_JOB_ID:-none}"

      - name: Verify production schema is current
        run: python manage.py migrate --check

      - name: Resolve interactive execution strategy
        id: execution
        shell: bash
        run: |
          MODE="${{ steps.schedule.outputs.mode }}"
          FAST="0"
          BOOTSTRAP="0"
          JOB_ID="${{ steps.schedule.outputs.generation_job_id }}"
          TARGET_DATE="${{ steps.schedule.outputs.target_date }}"

          if [ -n "$JOB_ID" ]; then
            COUNTS=$(python manage.py shell -c "from datetime import datetime,time,timedelta; from django.utils import timezone; from engine.models import Fixture,Prediction; from engine.score_v8 import V8_MODEL_VERSION; d=datetime.fromisoformat('$TARGET_DATE').date(); s=timezone.make_aware(datetime.combine(d,time.min)); e=s+timedelta(days=1); now=timezone.now(); fs=max(s,now); f=Fixture.objects.filter(kickoff__gte=fs,kickoff__lt=e).count(); p=Prediction.objects.filter(model_version=V8_MODEL_VERSION,fixture__kickoff__gte=fs,fixture__kickoff__lt=e).values('fixture_id').distinct().count(); print(f'{p} {f}')")
            PREDICTED_FIXTURES=$(echo "$COUNTS" | awk '{print $1}')
            FUTURE_FIXTURES=$(echo "$COUNTS" | awk '{print $2}')
            REQUIRED=8
            if [ "$FUTURE_FIXTURES" -lt "$REQUIRED" ]; then REQUIRED="$FUTURE_FIXTURES"; fi

            echo "Interactive coverage: predicted_fixtures=$PREDICTED_FIXTURES future_fixtures=$FUTURE_FIXTURES required=$REQUIRED"
            FAST="1"
            MODE="refresh"
            if [ "$REQUIRED" -gt 0 ] && [ "$PREDICTED_FIXTURES" -ge "$REQUIRED" ]; then
              echo "Usable score seed detected: selective Premium refresh only."
            else
              BOOTSTRAP="1"
              echo "No usable score seed: bootstrap will run BEFORE Premium refresh."
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$BOOTSTRAP" >> "$GITHUB_OUTPUT"
          echo "Final execution mode=$MODE interactive_fast=$FAST bootstrap=$BOOTSTRAP"

      - name: Run scheduled pipeline
        shell: bash
        run: |
          EXTRA_ARGS=()
          ATTEMPTS=3
          RETRY_DELAY=5
          PIPELINE_MODE="${{ steps.execution.outputs.mode }}"
          TARGET_DATE="${{ steps.schedule.outputs.target_date }}"
          JOB_ID="${{ steps.schedule.outputs.generation_job_id }}"

          if [ -n "$JOB_ID" ]; then
            EXTRA_ARGS+=(--generation-job-id "$JOB_ID")
            ATTEMPTS=1
            RETRY_DELAY=0
            export PREMIUM_INTERACTIVE_FAST=1
            echo "Interactive Premium optimization enabled."

            if [ "${{ steps.execution.outputs.bootstrap }}" = "1" ]; then
              echo "Building lightweight V8 seed before candidate selection..."
              # Critical: run bootstrap as a separate morning pass. Previously the
              # full pipeline saw 1-2 stale predictions after ingest and incorrectly
              # skipped SCORE_V8, leaving the candidate pool empty.
              python manage.py daily_pipeline \
                --mode morning \
                --date "$TARGET_DATE" \
                --attempts 1 \
                --retry-delay 0
              echo "Bootstrap complete; continuing with selective Premium refresh."
              PIPELINE_MODE="refresh"
            fi
          fi

          python manage.py daily_pipeline \
            --mode "$PIPELINE_MODE" \
            --date "$TARGET_DATE" \
            --attempts "$ATTEMPTS" \
            --retry-delay "$RETRY_DELAY" \
            "${EXTRA_ARGS[@]}"

      - name: Backtest Over 2.5 fragility cohort
        if: ${{ success() }}
        run: python manage.py over25_fragility_backtest --model-version "$MODEL_VERSION"
