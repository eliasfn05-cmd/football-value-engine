name: daily-scheduler

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 16 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "full"
        type: choice
        options: [full, morning, refresh, settlement]
      target_date:
        description: "Optional date YYYY-MM-DD; blank = current date in America/Lima"
        required: false
        type: string
      start_time:
        description: "Kickoff window start HH:MM (America/Lima)"
        required: false
        default: "00:00"
        type: string
      end_time:
        description: "Kickoff window end HH:MM inclusive (America/Lima)"
        required: false
        default: "23:59"
        type: string
      generation_job_id:
        description: "Optional dashboard PremiumGenerationJob id"
        required: false
        type: string

concurrency:
  group: football-value-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.generation_job_id != '' && format('interactive-{0}', github.event.inputs.target_date) || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.generation_job_id != '' }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: scheduler-cli-only-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      PGOPTIONS: "-c work_mem=128MB -c jit=off"
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
      ODDS_API_IO_BOOKMAKERS: Betano,Bet365,Betfair,Unibet,1xBet,Betway
      PREFERRED_BOOKMAKER: Betano
      APP_TIMEZONE: America/Lima
      MODEL_VERSION: "8.0"
      MIN_EDGE: "0.06"
      MIN_EV: "0.08"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Validate scheduler secrets
        run: |
          test -n "$DATABASE_URL" || (echo "Missing RENDER_DATABASE_URL" && exit 1)
          test -n "$API_FOOTBALL_KEY" || (echo "Missing API_FOOTBALL_KEY" && exit 1)
      - name: Resolve request
        id: schedule
        env:
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_DATE: ${{ github.event.inputs.target_date }}
          MANUAL_START_TIME: ${{ github.event.inputs.start_time }}
          MANUAL_END_TIME: ${{ github.event.inputs.end_time }}
          GENERATION_JOB_ID: ${{ github.event.inputs.generation_job_id }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${MANUAL_MODE:-full}"; elif [ "$SCHEDULE_EXPRESSION" = "0 11 * * *" ]; then MODE=morning; elif [ "$SCHEDULE_EXPRESSION" = "0 16 * * *" ]; then MODE=refresh; else MODE=settlement; fi
          TARGET_DATE="${MANUAL_DATE:-$(TZ=America/Lima date +%F)}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "start_time=${MANUAL_START_TIME:-00:00}" >> "$GITHUB_OUTPUT"
          echo "end_time=${MANUAL_END_TIME:-23:59}" >> "$GITHUB_OUTPUT"
          echo "generation_job_id=${GENERATION_JOB_ID:-}" >> "$GITHUB_OUTPUT"
      - name: Verify schema
        run: python manage.py migrate --check
      - name: Run pipeline
        run: |
          MODE="${{ steps.schedule.outputs.mode }}"; DATE="${{ steps.schedule.outputs.target_date }}"; START="${{ steps.schedule.outputs.start_time }}"; END="${{ steps.schedule.outputs.end_time }}"; JOB="${{ steps.schedule.outputs.generation_job_id }}"
          if [ -n "$JOB" ]; then
            export PREMIUM_INTERACTIVE_FAST=1 PREMIUM_WINDOW_START="$START" PREMIUM_WINDOW_END="$END"
            python manage.py shell -c "from django.utils import timezone; from scanner.models import PremiumGenerationJob; PremiumGenerationJob.objects.filter(pk=$JOB).update(status=PremiumGenerationJob.STATUS_RUNNING,current_stage='INGEST',progress_pct=3,message='Carga rápida de fixtures.',started_at=timezone.now(),finished_at=None)"
            python manage.py ingest_daily --date "$DATE" --fixtures-only
            python manage.py shell -c "from scanner.models import PremiumGenerationJob; PremiumGenerationJob.objects.filter(pk=$JOB).update(current_stage='BOOTSTRAP_V8',progress_pct=8,message='Bootstrap por lotes del bloque $START-$END; cobertura completa del rango.')"
            # Full-window recall: no fixture cap. The command processes the selected
            # kickoff range in bounded batches, while expensive evidence remains
            # reserved for the candidate shortlist before Premium admission.
            python manage.py scan_daily --date "$DATE" --v8-bootstrap --limit 0 --batch-size 100
            python manage.py daily_pipeline --mode refresh --date "$DATE" --attempts 1 --retry-delay 0 --generation-job-id "$JOB"
          else
            python manage.py daily_pipeline --mode "$MODE" --date "$DATE" --attempts 3 --retry-delay 5
          fi
      - name: Backtest Over 2.5 fragility cohort
        if: ${{ success() }}
        run: python manage.py over25_fragility_backtest --model-version "$MODEL_VERSION"