name: btts-filter-20260904

on:
  push:
    paths:
      - '.github/workflows/btts-filter-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: btts-filter-cli-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      APP_TIMEZONE: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Backfill missing Sep 4 BTTS target predictions
        run: |
          mkdir -p docs/audits
          OUT=docs/audits/btts_backfill_20260904.txt
          echo "RUN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT"
          python manage.py backfill_btts_targets_20260904 >> "$OUT" 2>&1
          cat "$OUT"
      - name: Run Sep 4 BTTS system filter
        run: |
          OUT=docs/audits/btts_filter_20260904.txt
          echo "RUN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT"
          python manage.py btts_filter_20260904 >> "$OUT" 2>&1
          cat "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/btts_backfill_20260904.txt "$OUT"
          git commit -m "chore(filter): persist Sep 4 targeted BTTS backfill and filter" || true
          git pull --rebase origin main || true
          git push
