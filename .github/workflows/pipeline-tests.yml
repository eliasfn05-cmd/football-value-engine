name: pipeline-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline-test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///ci-pipeline.sqlite3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run pipeline tests
        run: >-
          python manage.py test
          tests.test_daily_pipeline
          tests.test_batch_daily_path
          tests.test_ingestion_fast_mode
          tests.test_sprint5_incremental
          tests.test_scanner
          tests.test_premium_enrichment
          -v 2
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Verify dashboard tests
        run: python manage.py test tests.test_dashboard -v 1
