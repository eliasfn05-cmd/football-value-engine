name: backtesting-learning-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backtesting-learning-test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///ci.sqlite3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations are synchronized
        run: python manage.py makemigrations --check --dry-run

      - name: Run Sprint 4.5 tests
        run: python manage.py test tests.test_backtesting_learning -v 2
