name: btts-v298-db-audit

on:
  push:
    paths:
      - '.github/workflows/btts-v298-db-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: btts-v298-audit-cli-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      APP_TIMEZONE: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Register Sep 2 BTTS results and persist evidence
        shell: bash
        run: |
          mkdir -p docs/audits
          OUT=docs/audits/btts_20260902_db_registration.txt
          : > "$OUT"
          echo "RUN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$OUT"
          set +e
          python manage.py register_verified_btts_results_20260902 2>&1 | tee -a "$OUT"
          REG_RC=${PIPESTATUS[0]}
          echo "REGISTER_EXIT=$REG_RC" | tee -a "$OUT"
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "chore(audit): persist Sep 2 BTTS DB registration" || true
          git pull --rebase origin main || true
          git push
          if [ "$REG_RC" -ne 0 ]; then exit 1; fi
