name: btts-v299-db-audit

on:
  push:
    paths:
      - '.github/workflows/btts-v298-db-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: btts-v299-audit-cli-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      APP_TIMEZONE: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Register Sep 3 BTTS results and run V2.9.9 audit
        run: |
          mkdir -p docs/audits
          OUT=docs/audits/btts_v299_one_sided_db_audit.txt
          echo "RUN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$OUT"
          python manage.py register_verified_btts_results_20260903 >> "$OUT" 2>&1
          echo "REGISTER_EXIT=0" >> "$OUT"
          python manage.py btts_v299_one_sided_audit >> "$OUT" 2>&1
          echo "AUDIT_EXIT=0" >> "$OUT"
          cat "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "chore(audit): persist V2.9.9 one-sided DB evidence" || true
          git pull --rebase origin main || true
          git push

# rerun-registration-v2
